[project]
name = "fraud-calibrated"
version = "0.1.0"
description = "Cost-sensitive credit default risk modelling: imbalance, calibration, expected-cost thresholds, SHAP, and drift monitoring."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "shap>=0.52.0",
    "xlrd>=2.0.2",
]

# Most projects here ship a CLI. Entry points REQUIRE a real build backend —
# a uv virtual project ([tool.uv] package = false) installs nothing, so the
# documented command fails with "No module named ..." even while tests pass
# (pytest's pythonpath hides it). Bit us on A1, nearly again on A3.
# No-CLI projects (static sites, notebooks-only): delete [project.scripts];
# the build backend is harmless to keep.
[project.scripts]
fraud-calibrated = "fraud_calibrated.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ⚠️ When /new-project renames src/app, update BOTH the line below AND the
# [project.scripts] target above.
[tool.hatch.build.targets.wheel]
packages = ["src/fraud_calibrated"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
